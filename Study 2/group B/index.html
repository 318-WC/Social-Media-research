<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市生活指南 - 发现精彩世界</title>
    <style>
        :root {
            --primary-color: #00b96b;
            --bg-color: #ffffff;
            --secondary-bg: #f5f5f5;
            --text-main: #222222;
            --text-muted: #666666;
            --border-color: #eeeeee;
        }

        body { 
            margin: 0; background-color: var(--bg-color); 
            font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            display: flex;
        }

        /* --- 侧边栏 --- */
        .side-bar {
            width: 240px; height: 100vh; border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 24px;
            position: fixed; left: 0; top: 0; background: #fff; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: bold; color: var(--primary-color); margin-bottom: 40px; }
        .nav-item { 
            padding: 12px 16px; border-radius: 8px; cursor: pointer; 
            display: flex; align-items: center; gap: 12px; color: var(--text-main);
            margin-bottom: 8px; transition: 0.2s;
        }
        .nav-item:hover { background: var(--secondary-bg); }
        .nav-item.active { background: var(--secondary-bg); color: var(--primary-color); font-weight: 600; }

        /* --- 主内容区 --- */
        .main-wrapper { flex: 1; margin-left: 240px; padding: 0 40px; }
        .header { 
            height: 72px; display: flex; align-items: center; justify-content: center;
            position: sticky; top: 0; background: #fff; z-index: 50;
        }
        .search-container { background: var(--secondary-bg); border-radius: 20px; padding: 8px 20px; width: 50%; }
        .search-input { border: none; background: transparent; width: 100%; outline: none; font-size: 14px; }

        /* --- 瀑布流布局 --- */
        .feed-container { 
            max-width: 1200px; margin: 20px auto; 
            column-count: 4; column-gap: 16px; 
        }

        .note-card {
            break-inside: avoid; margin-bottom: 16px; background: #fff; 
            border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color);
            cursor: pointer; transition: 0.3s;
        }
        .note-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .note-image { width: 100%; display: block; }
        .note-info { padding: 12px; }
        .note-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; color: var(--text-main); }
        .note-author { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
        .author-avatar { width: 20px; height: 20px; border-radius: 50%; }

        @media (max-width: 1024px) { .feed-container { column-count: 3; } }
        @media (max-width: 768px) {
            .side-bar { display: none; }
            .main-wrapper { margin-left: 0; padding: 0 12px; }
            .feed-container { column-count: 2; column-gap: 8px; }
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; width: 90%; max-width: 900px; height: 85vh; border-radius: 16px;
            display: flex; overflow: hidden; position: relative;
        }
        .modal-left { flex: 1.2; background: #000; display: flex; align-items: center; justify-content: center; }
        .modal-left img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-right { flex: 1; padding: 30px; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; z-index: 10; }
    </style>
</head>
<body>

    <div class="side-bar">
        <div class="logo">城市指南</div>
        <div class="nav-item active">🏠 发现</div>
        <div class="nav-item">🔍 搜索</div>
        <div class="nav-item">➕ 发布</div>
        <div class="nav-item">👤 我的</div>
    </div>

    <div class="main-wrapper">
        <div class="header">
            <div class="search-container">

            </div>
        </div>
        <div class="feed-container" id="grid"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">×</span>
            <div class="modal-left"><img id="modalImg" src=""></div>
            <div class="modal-right">
                <div class="note-author" style="margin-bottom:15px;">
                    <img id="modalAvatar" class="author-avatar" style="width:30px; height:30px;">
                    <span id="modalAuthor" style="font-weight:bold;"></span>
                </div>
                <h2 id="modalTitle"></h2>
                <p id="modalBody" style="white-space: pre-line; line-height: 1.7; color: #333; font-size: 15px;"></p>
            </div>
        </div>
    </div>

            { id: 8, title: "洛阳周末游：老君山汉服路线", author: "古都爱好者", avatar: "https://randomuser.me/api/portraits/men/8.jpg", image: "https://raw.githubusercontent.com/318-WC/Social-Media-research/refs/heads/main/Luoyang%202_1.JPG", body: "周末建议安排老君山两日游行程。第一天前往山顶区域进行观景活动。第二天返回市区体验汉服拍照。中午品尝当地特色小吃。整体行程结合自然与文化体验。\n\n#洛阳 #老君山 #汉服 #周末出游 #自然风景 #旅游路线" },

            { id: 11, title: "贵阳美食游：本地小吃路线推荐", author: "筑城食客", avatar: "https://randomuser.me/api/portraits/men/11.jpg", image: "https://raw.githubusercontent.com/318-WC/Social-Media-research/refs/heads/main/Guiyang%201_1.JPG", body: "建议在市区安排美食探索行程。\n可优先选择本地人常去的餐厅。\n用餐过程中体验多种特色小吃。\n下午可在周边区域进行简单活动。\n整体体验以饮食文化为主要内容。\n\n#贵阳 #美食 #小吃 #探店 #城市生活 #旅游推荐" },
            { id: 12, title: "贵阳周末游：花溪黔灵山路线", author: "林城漫步者", avatar: "https://randomuser.me/api/portraits/women/12.jpg", image: "https://raw.githubusercontent.com/318-WC/Social-Media-research/refs/heads/main/Guiyang%202_1.JPG", body: "周末建议前往花溪公园进行散步活动。\n中午可在周边品尝当地特色餐饮。\n下午前往黔灵山进行简单登山。\n游览过程中注意环境与安全。\n整体行程结合自然与城市休闲体验。\n\n#贵阳 #花溪 #黔灵山 #周末出游 #自然景观 #城市休闲" },
            { id: 13, title: "万宁海边游：日月湾休闲路线", author: "浪迹逐海人", avatar: "https://randomuser.me/api/portraits/men/13.jpg", image: "https://raw.githubusercontent.com/318-WC/Social-Media-research/refs/heads/main/Wanning%201_1.JPG", body: "建议前往万宁日月湾进行海边活动。\n可选择冲浪或基础体验项目。\n白天适合在海滩进行拍照。\n下午可在咖啡馆休息放松。\n整体节奏轻松，适合度假型出行。\n\n#万宁 #日月湾 #海边 #冲浪 #度假旅行 #海南旅游" },
            { id: 14, title: "万宁自驾游：石梅湾沿海路线", author: "环岛逐风手", avatar: "https://randomuser.me/api/portraits/women/14.jpg", image: "https://raw.githubusercontent.com/318-WC/Social-Media-research/refs/heads/main/Wanning%202_1.JPG", body: "建议安排沿海自驾行程进行游览。\n可从石梅湾出发前往神州半岛。\n途中可多次停留进行观景与拍照。\n中午安排海边餐厅用餐。\n整体行程以自然景观体验为主。\n\n#万宁 #石梅湾 #自驾游 #海岸线 #周末出游 #海南旅行" },

        // 随机排列函数 (Fisher-Yates Shuffle)
        function shufflePosts(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function render(data) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            data.forEach(post => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <img class="note-image" src="${post.image}" loading="lazy">
                    <div class="note-info">
                        <div class="note-title">${post.title}</div>
                        <div class="note-author">
                            <img class="author-avatar" src="${post.avatar}">
                            <span>${post.author}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openModal(post);
                grid.appendChild(card);
            });
        }

        const modal = document.getElementById('modal');
        function openModal(post) {
            document.getElementById('modalImg').src = post.image;
            document.getElementById('modalAvatar').src = post.avatar;
            document.getElementById('modalAuthor').innerText = post.author;
            document.getElementById('modalTitle').innerText = post.title;
            document.getElementById('modalBody').innerText = post.body;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = posts.filter(p => p.title.toLowerCase().includes(val) || p.body.toLowerCase().includes(val));
            render(filtered);
        };

        // 页面加载时执行随机排列并渲染
        const randomizedData = shufflePosts(posts);
        render(randomizedData);
    </script>
</body>
</html>
